{% extends 'base.html' %}{% block title %}الإشعارات | المستشار{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">التنبيهات</span><h1>الإشعارات</h1></div><form method="post" action="/notifications/read-all"><input type="hidden" name="csrf" value="{{csrf}}"><button class="btn ghost">تحديد الكل كمقروء</button></form></div><div class="timeline">{% for n in items %}<div class="card {{'notification-unread' if not n.read_at else ''}}"><div class="course-top"><span class="badge {{'success' if n.kind=='success' else ''}}">{{n.kind}}</span><small>{{n.created_at}}</small></div><h3>{{n.title}}</h3><p>{{n.body}}</p></div>{% else %}<div class="empty">لا توجد إشعارات بعد.</div>{% endfor %}</div>{% endblock %}
