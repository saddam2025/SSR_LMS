services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragab_lms}
      POSTGRES_USER: ${POSTGRES_USER:-ragab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragab} -d ${POSTGRES_DB:-ragab_lms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    environment:
      ENV: ${ENV:-development}
      APP_SECRET: ${APP_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      REQUIRE_STAFF_MFA: ${REQUIRE_STAFF_MFA:-true}
      TRUST_PROXY_HEADERS: "true"
      VIDEO_ALLOWED_HOSTS: ${VIDEO_ALLOWED_HOSTS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragab}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragab_lms}
      REDIS_URL: redis://redis:6379/0
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-2}
      STUDENT_SINGLE_SESSION: ${STUDENT_SINGLE_SESSION:-true}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-45}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-24}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      UVICORN_KEEPALIVE_SECONDS: ${UVICORN_KEEPALIVE_SECONDS:-5}
      UVICORN_BACKLOG: ${UVICORN_BACKLOG:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_RETRY_SECONDS: ${REDIS_RETRY_SECONDS:-5}
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DRM_PROVIDER: ${DRM_PROVIDER:-}
      DRM_LICENSE_SERVER_URL: ${DRM_LICENSE_SERVER_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
